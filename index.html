<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda del Sistema</title>
    <style>
        /* Diseño básico responsive */
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f4f4f4; 
            margin: 0;
        }
        .contenedor { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        input, button { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
            background: #28a745; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        button:hover { 
            background: #218838; 
        }
        .oculto { 
            display: none; 
        }
        .error { 
            color: #dc3545; 
            font-weight: bold; 
        }
        .warning { 
            background: #fff3cd; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px; 
            border-left: 4px solid #ffc107;
        }
        ul { 
            list-style: none; 
            padding: 0; 
        }
        li { 
            background: #f9f9f9; 
            margin: 10px 0; 
            padding: 12px; 
            border-radius: 4px; 
            border-left: 4px solid #007bff; 
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Sistema de Agenda</h1>
    
    <!-- PANTALLA 1: INICIO DE SESIÓN -->
    <div id="pantalla-login">
        <h3>Iniciar Sesión</h3>
        <div class="warning">
            ⚠️ Este sistema requiere autenticación con usuario y contraseña.<br>
            Consulta con el administrador si no tienes credenciales.
        </div>
        <input type="text" id="input-usuario" placeholder="Usuario">
        <input type="password" id="input-contrasena" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Entrar</button>
        <div id="error-login" class="error" style="display: none; margin-top: 10px;"></div>
    </div>

    <!-- PANTALLA 2: PANEL DE CONTROL -->
    <div id="pantalla-panel" class="oculto">
        <h3 id="mensaje-bienvenida">Bienvenido</h3>
        <button onclick="cerrarSesion()" style="background: #dc3545; margin-bottom: 10px;">Cerrar Sesión</button>
        
        <hr>
        <h4>Agendar Nueva Cita</h4>
        <input type="text" id="cita-titulo" placeholder="Título (Ej. Reunión de proyecto)">
        <input type="datetime-local" id="cita-fecha">
        <input type="text" id="cita-detalles" placeholder="Detalles de la actividad">
        <button onclick="crearNuevaCita()">Agendar Actividad</button>

        <hr>
        <h4>Mis Citas</h4>
        <button onclick="cargarCitas()" style="background: #007bff;">Actualizar Lista</button>
        <ul id="lista-citas">
            <!-- Las citas aparecerán aquí dinámicamente -->
        </ul>
    </div>
</div>

<script>
    // URL de tu Web App publicada en Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbwa3i_9q-Y_AlU25Ok22NmpWgX1ghBmVeoenlm9ucuNtdec5jjAJA4KbOwIsvgOM6R7Ew/exec";
    
    let miIdUsuario = "";
    let miRol = "user";

    // 1. Función para realizar peticiones POST al backend
    async function peticionBackend(datosPayload) {
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(datosPayload),
                headers: { 
                    "Content-Type": "text/plain"
                }
            });

            const textoRespuesta = await response.text();
            console.log("Respuesta del servidor:", textoRespuesta);
            return JSON.parse(textoRespuesta);
            
        } catch (error) {
            console.error("Error en peticionBackend:", error);
            return { success: false, mensaje: "Error de conexión: " + error.message };
        }
    }

    // 2. Inicio de Sesión
    async function iniciarSesion() {
        const usuario = document.getElementById("input-usuario").value.trim();
        const contrasena = document.getElementById("input-contrasena").value.trim();
        const errorDiv = document.getElementById("error-login");

        errorDiv.style.display = "none";

        if (!usuario || !contrasena) {
            errorDiv.textContent = "❌ Usuario y contraseña son obligatorios";
            errorDiv.style.display = "block";
            return;
        }

        const resultado = await peticionBackend({
            accion: "login",
            usuario: usuario,
            contrasena: contrasena
        });

        if (resultado.success) {
            miIdUsuario = resultado.idUsuario;
            miRol = resultado.rol || "user";

            document.getElementById("pantalla-login").classList.add("oculto");
            document.getElementById("pantalla-panel").classList.remove("oculto");
            document.getElementById("mensaje-bienvenida").innerText = `Bienvenido, ${escapeHtml(resultado.usuario)} (Rol: ${escapeHtml(miRol)})`;
            
            cargarCitas();
        } else {
            errorDiv.textContent = `❌ ${resultado.mensaje || "Credenciales inválidas"}`;
            errorDiv.style.display = "block";
        }
    }

    // 3. Cerrar Sesión
    function cerrarSesion() {
        miIdUsuario = "";
        miRol = "user";

        document.getElementById("input-usuario").value = "";
        document.getElementById("input-contrasena").value = "";
        document.getElementById("cita-titulo").value = "";
        document.getElementById("cita-fecha").value = "";
        document.getElementById("cita-detalles").value = "";

        document.getElementById("pantalla-panel").classList.add("oculto");
        document.getElementById("pantalla-login").classList.remove("oculto");
    }

    // 4. Crear Nueva Cita
    async function crearNuevaCita() {
        const titulo = document.getElementById("cita-titulo").value.trim();
        const fecha = document.getElementById("cita-fecha").value;
        const detalles = document.getElementById("cita-detalles").value.trim();

        if (!titulo || !fecha) {
            alert("❌ Título y Fecha son obligatorios");
            return;
        }

        const datos = {
            accion: "crear_cita",
            idUsuario: miIdUsuario,
            titulo: titulo,
            fechaHora: fecha,
            detalles: detalles
        };

        const resultado = await peticionBackend(datos);
        if (resultado.success) {
            alert("✅ ¡Cita agendada con éxito!");
            document.getElementById("cita-titulo").value = "";
            document.getElementById("cita-fecha").value = "";
            document.getElementById("cita-detalles").value = "";
            cargarCitas();
        } else {
            alert(`❌ Error: ${resultado.mensaje || "No se pudo crear la cita"}`);
        }
    }

    // 5. Cargar Citas
    async function cargarCitas() {
        const datos = {
            accion: "obtener_citas",
            idUsuario: miIdUsuario,
            rol: miRol
        };

        const resultado = await peticionBackend(datos);
        const lista = document.getElementById("lista-citas");
        lista.innerHTML = "";

        if (resultado.success && resultado.citas && resultado.citas.length > 0) {
            resultado.citas.forEach(cita => {
                const li = document.createElement("li");
                
                const titulo = document.createElement("strong");
                titulo.textContent = cita.titulo;
                
                const fecha = document.createElement("span");
                fecha.textContent = ` - ${cita.fechaHora.replace("T", " ")}`;
                
                const detalles = document.createElement("small");
                detalles.style.display = "block";
                detalles.style.marginTop = "4px";
                detalles.style.color = "#555";
                detalles.textContent = cita.detalles || "Sin detalles adicionales";
                
                const btnEditar = document.createElement("button");
                btnEditar.textContent = "✏️ Editar Cita";
                btnEditar.style.background = "#ffc107";
                btnEditar.style.color = "#000";
                btnEditar.style.padding = "6px 10px";
                btnEditar.style.marginTop = "8px";
                btnEditar.onclick = () => editarMiCita(cita);

                li.appendChild(titulo);
                li.appendChild(fecha);
                li.appendChild(detalles);
                li.appendChild(btnEditar);
                
                lista.appendChild(li);
            });
        } else {
            const li = document.createElement("li");
            li.textContent = "No hay citas agendadas.";
            lista.appendChild(li);
        }
    }

    // 6. Editar Cita
    async function editarMiCita(cita) {
        const nuevoTitulo = prompt("Escribe el nuevo título:", cita.titulo);
        const nuevaFecha = prompt("Escribe la nueva fecha (Año-Mes-DíaTHora:Min):", cita.fechaHora);
        const nuevosDetalles = prompt("Detalles adicionales:", cita.detalles || "");

        if (!nuevoTitulo || !nuevaFecha) return;

        const datos = {
            accion: "editar_cita",
            idCita: cita.idCita,
            idUsuario: miIdUsuario,
            titulo: nuevoTitulo.trim(),
            fechaHora: nuevaFecha,
            detalles: nuevosDetalles ? nuevosDetalles.trim() : cita.detalles
        };

        const resultado = await peticionBackend(datos);
        if (resultado.success) {
            alert("✅ Cita actualizada correctamente.");
            cargarCitas();
        } else {
            alert(`❌ Error: ${resultado.mensaje || "No se pudo editar la cita"}`);
        }
    }

    // 7. Escapar HTML para seguridad
    function escapeHtml(texto) {
        const div = document.createElement("div");
        div.textContent = texto;
        return div.innerHTML;
    }
</script>

</body>
</html>
